   Couches : utils → stockage (DB) → services (auth, recherche, contact,

   Toute la donnée passe par les fonctions "services" : pour brancher un

/* ---------- Utils ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const uid=p=>p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

const fcfa=n=>Number(n).toLocaleString('fr-FR')+' FCFA';
const dateFr=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
const timeFr=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):dateFr(t)};
const fix1=n=>n.toFixed(1).replace('.',',');
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
function haversine(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function readImg(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

async function hashPw(pw,salt){if(!(window.crypto&&crypto.subtle))throw new Error('Navigateur non pris en charge.');const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- Connexion à Supabase ---------- */

 return{id:r.id,userId:r.user_id,name:r.display_name,business:r.business_name||'',trade:r.trade,catId:r.category_id,locId:r.location_id,

/* ---------- Services : recherche ---------- */
function posOf(p){const c=CITIES[p.city];return c?(c.q[p.quartier]||c.c):null}
function score(p,toks){
 const c=catById(p.catId),F=[[p.name+' '+p.business,3],[p.trade+' '+(c?c.name:''),3],[p.services.map(s=>s.name).join(' '),2],[p.quartier+' '+p.city,2],[p.desc+' '+p.zone,1]].map(([t,w])=>[norm(t).split(' '),w]);
 let tot=0;
 for(const t of toks){let best=0;for(const[ws,w]of F)for(const h of ws){let s=0;if(h===t)s=w;else if(t.length>=2&&h.startsWith(t))s=w*.8;else if(t.length>=4&&lev(h,t)<=(t.length>=7?2:1))s=w*.6;if(s>best)best=s}if(!best)return 0;tot+=best}
 return tot}
function refPoint(f){if(S.loc)return[S.loc.lat,S.loc.lng];if(f.quartier&&CITIES[f.city]&&CITIES[f.city].q[f.quartier])return CITIES[f.city].q[f.quartier];return null}
function runSearch(f){
 const toks=norm(f.q).split(' ').filter(Boolean),ref=refPoint(f);
 let l=pubPros();
 if(f.cat)l=l.filter(p=>p.catId===f.cat);
 if(f.city)l=l.filter(p=>p.city===f.city);
 if(f.quartier)l=l.filter(p=>norm(p.quartier)===norm(f.quartier));
 if(f.avail)l=l.filter(p=>p.available);
 if(f.maxPrice)l=l.filter(p=>p.priceFrom<=f.maxPrice);
 if(f.minRating)l=l.filter(p=>stats(p.id).avg>=f.minRating);
 let out=l.map(p=>{const pos=posOf(p);return{p,d:ref&&pos?haversine(ref,pos):null,s:toks.length?score(p,toks):1}}).filter(x=>x.s>0);
 if(f.maxDist&&ref)out=out.filter(x=>x.d!=null&&x.d<=f.maxDist);
 out.sort((a,b)=>(b.s-a.s)||((a.d!=null&&b.d!=null)?a.d-b.d:0)||(stats(b.p.id).avg-stats(a.p.id).avg));
 return out}

 if(o.photo)return`<div class="av" style="width:${sz}px;height:${sz}px"><img src="${o.photo}" alt=""></div>`;
 const h=o.hue!=null?o.hue:(o.name||'').length*37%360;
 return`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.36)}px;background:linear-gradient(135deg,hsl(${h} 55% 38%),hsl(${(h+40)%360} 60% 28%))" aria-hidden="true">${ini}</div>`}
const vbadge=()=>`<span class="vb" title="Professionnel vérifié">${ic('badge',20)}</span>`;
function bar(title,back=true,right=''){return`<div class="bar">${back?`<button class="ib bg" data-act="back" aria-label="Retour">${ic('back')}</button>`:''}<h2>${esc(title)}</h2>${right}</div>`}
const empty=(t,x,btn='')=>`<div class="empty"><h3>${esc(t)}</h3><p>${esc(x)}</p>${btn}</div>`;
function field(label,name,val='',o={}){return`<label class="fld"><span>${esc(label)}</span>${o.area?`<textarea class="in" name="${name}" ${o.req?'required':''} maxlength="${o.max||600}" placeholder="${esc(o.ph||'')}">${esc(val)}</textarea>`:`<input class="in" name="${name}" type="${o.type||'text'}" value="${esc(val)}" ${o.req?'required':''} ${o.list?`list="${o.list}"`:''} autocomplete="${o.ac||'off'}" inputmode="${o.im||'text'}" maxlength="${o.max||120}" placeholder="${esc(o.ph||'')}">`}</label>`}
const cityOpts=(sel,all)=>(all?`<option value="">${all}</option>`:'')+Object.keys(CITIES).map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');
const quartierList=()=>`<datalist id="ql">${Object.values(CITIES).flatMap(c=>Object.keys(c.q)).map(q=>`<option value="${q}">`).join('')}</datalist>`;
const catOpts=(sel,all)=>(all?`<option value="">${all}</option>`:'')+DB.categories.filter(c=>c.active||c.id===sel).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');

function card(p,d){
 const st=stats(p.id);
 return`<div class="pc"><a class="pc-main" href="#/p/${p.id}" aria-label="Voir le profil de ${esc(p.name)}">${avatar(p,64)}<div class="grow"><h3>${esc(p.name)}${p.status==='VERIFIED'?vbadge():''}</h3>
 <div class="meta"><span class="b" style="color:var(--ink)">${esc(p.trade)}</span></div>
 <div class="meta">${st.n?`<span class="star">${ic('star',15)}</span><b style="color:var(--ink)">${fix1(st.avg)}</b> (${st.n} avis)`:'Pas encore d’avis'}</div>
 <div class="meta">${ic('pin',15)} ${esc(p.quartier)}, ${esc(p.city)}${d!=null?` · ≈ ${fix1(d)} km`:''}</div>
 <div class="meta"><span class="b" style="color:var(--ink)">Dès ${fcfa(p.priceFrom)}</span> · <span class="pill ${p.available?'live':'off'}">${p.available?'Disponible':'Indisponible'}</span>${p.demo?' <span class="pill demo">Démo</span>':''}</div></div></a>
 <button class="heart ${isFav(p.id)?'on':''}" data-act="fav" data-id="${p.id}" aria-label="${isFav(p.id)?'Retirer des favoris':'Ajouter aux favoris'}" aria-pressed="${isFav(p.id)}">${ic('heart',24)}</button>
 <div class="pc-act"><a class="btn wa s grow" href="${waLink(p)}" target="_blank" rel="noopener" data-act="track" data-type="whatsapp" data-id="${p.id}">${ic('wa',18)} WhatsApp</a><a class="btn line s grow" href="${telLink(p)}" data-act="track" data-type="tel" data-id="${p.id}">${ic('phone',18)} Appeler</a></div></div>`}

/* ---------- Feuilles, toasts ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
function sheet(h){const s=document.getElementById('sheet');s.innerHTML=`<div class="sb" role="dialog" aria-modal="true">${h}</div>`;s.hidden=false}
function closeSheet(){const s=document.getElementById('sheet');s.hidden=true;s.innerHTML=''}
function ask(text,yes,label='Confirmer'){S.pending=yes;sheet(`<h3>${esc(text)}</h3><div class="row gap"><button class="btn line grow" data-act="sheet-close">Annuler</button><button class="btn pri grow" data-act="ask-yes">${label}</button></div>`)}
const go=h=>{if(location.hash===h)render();else location.hash=h};
const needLogin=(msg)=>{S.ret=location.hash;toast(msg);go('#/auth')};

function resultsHtml(){

 return`<p class="sm mut" aria-live="polite">${all.length} professionnel${all.length>1?'s':''}${refPoint(f)?' · triés par pertinence puis distance':''}</p>${shown.map(x=>card(x.p,x.d)).join('')}${shown.length<all.length?`<button class="btn line block" data-act="more">Voir plus (${all.length-shown.length})</button>`:''}`}

VIEWS.favs=()=>{
 const l=DB.favorites.filter(f=>f.userId===favKey()).map(f=>proById(f.proId)).filter(isPubl),ref=refPoint(S.search);
 return`${bar('Mes favoris',false)}<div class="pad">${l.length?l.map(p=>{const pos=posOf(p);return card(p,ref&&pos?haversine(ref,pos):null)}).join(''):empty('Aucun favori pour le moment','Touchez le cœur sur un profil pour le retrouver ici.','<a class="btn pri" href="#/search">Trouver un professionnel</a>')}</div>`};

function myThreads(){const u=me();if(!u)return[];const mp=myPro();return DB.threads.filter(t=>t.clientId===u.id||(mp&&t.proId===mp.id)).sort((a,b)=>lastTs(b)-lastTs(a))}
const lastTs=t=>t.msgs.length?t.msgs[t.msgs.length-1].ts:t.created;
function unreadT(t){const u=me();if(!u||!t.msgs.length)return false;const l=t.msgs[t.msgs.length-1];return l.from!==u.id&&!l.read}
const unreadCount=()=>myThreads().filter(unreadT).length;
VIEWS.msgs=([tid])=>{
 const u=me();
 if(!u)return`${bar('Messages',false)}${empty('Connectez-vous pour discuter','Vos échanges avec les professionnels apparaissent ici.','<a class="btn pri" href="#/auth" data-act="loginret">Se connecter</a>')}`;
 if(tid){
  const t=DB.threads.find(x=>x.id===tid),mp=myPro();
  if(!t||!(t.clientId===u.id||(mp&&t.proId===mp.id)))return bar('Messages')+empty('Conversation introuvable','');
  const p=proById(t.proId),cl={name:t.clientName||'Client'},other=u.id===t.clientId?p:cl;
  return`${bar(other?other.name:'Conversation',true,other?avatar(other,40):'')}<div class="pad" style="padding-bottom:8px">${p&&p.demo&&u.id===t.clientId?'<div class="banner">Profil de démonstration : ce professionnel ne répondra pas. Passez en « professionnel démo » pour tester les réponses.</div>':''}
  <div id="chat">${t.msgs.length?t.msgs.map(m=>`<div class="bub ${m.from===u.id?'me':'ot'}">${esc(m.text)}<small>${timeFr(m.ts)}</small></div>`).join(''):'<p class="mut center">Écrivez votre premier message.</p>'}</div></div>
  <form data-form="send" data-id="${t.id}" class="actbar" style="padding:10px 12px"><input class="in grow" name="text" maxlength="1000" required placeholder="Votre message" aria-label="Votre message" autocomplete="off"><button class="btn pri" aria-label="Envoyer" style="flex:none;min-width:52px">${ic('send',20)}</button></form>`}
 const l=myThreads();
 return`${bar('Messages',false)}<div class="pad">${l.length?`<div class="list">${l.map(t=>{const p=proById(t.proId),cl={name:t.clientName||'Client'},mp=myPro(),o=(mp&&t.proId===mp.id)?cl:p,lm=t.msgs[t.msgs.length-1];return`<a class="li" href="#/msgs/${t.id}">${avatar(o||{name:'?'},44)}<div class="grow"><div class="b">${esc(o?o.name:'Utilisateur')}</div><div class="xs mut" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lm?esc(lm.text):'Nouvelle conversation'}</div></div>${unreadT(t)?'<span class="pill">Nouveau</span>':''}<span class="xs mut">${timeFr(lastTs(t))}</span></a>`}).join('')}</div>`:empty('Aucune conversation','Ouvrez un profil et touchez le bouton message pour écrire à un professionnel.','<a class="btn pri" href="#/search">Trouver un professionnel</a>')}</div>`};

 <label class="fld"><span>Prix de départ maximum</span><select class="in sel" id="fprice">${[[0,'Tous les prix'],[5000,'5 000 FCFA'],[10000,'10 000 FCFA'],[25000,'25 000 FCFA'],[50000,'50 000 FCFA'],[100000,'100 000 FCFA']].map(([v,n])=>`<option value="${v}" ${f.maxPrice===v?'selected':''}>${n}</option>`).join('')}</select></label>
 <label class="fld"><span>Note minimale</span><select class="in sel" id="frate">${[[0,'Toutes les notes'],[3,'3 étoiles et plus'],[4,'4 étoiles et plus'],[4.5,'4,5 étoiles et plus']].map(([v,n])=>`<option value="${v}" ${f.minRating===v?'selected':''}>${n}</option>`).join('')}</select></label>
 <label class="chk"><input type="checkbox" id="favail" ${f.avail?'checked':''}> Disponible maintenant</label><div class="row gap mt"><button class="btn line grow" data-act="filtreset">Réinitialiser</button><button class="btn pri grow" data-act="filtok">Voir les résultats</button></div>`)},
 filtok(){const f=S.search;f.cat=document.getElementById('fcat').value;f.maxDist=+document.getElementById('fdist').value;f.maxPrice=+document.getElementById('fprice').value;f.minRating=+document.getElementById('frate').value;f.avail=document.getElementById('favail').checked;f.page=1;closeSheet();render()},
 filtreset(){const q=S.search;S.search={...freshSearch(),q:q.q,city:q.city,quartier:q.quartier};closeSheet();render()},
 lightbox(el){const p=proById(el.dataset.id),i=+el.dataset.i;sheet(`<img src="${esc(p.photos[i])}" alt="Réalisation de ${esc(p.name)}" style="width:100%;border-radius:14px;margin-bottom:12px"><button class="btn line block" data-act="sheet-close">Fermer</button>`)},
 report(el){const u=me();if(!u)return needLogin('Connectez-vous pour signaler.');const t=el.dataset.type,id=el.dataset.id;sheet(`<h3>${t==='review'?'Signaler cet avis':'Signaler ce profil'}</h3><form data-form="report" data-type="${t}" data-id="${id}"><label class="fld"><span>Motif</span><select class="in sel" name="reason">${(t==='review'?['Faux avis','Propos inappropriés','Sans rapport avec le service']:['Informations trompeuses','Comportement abusif','Arnaque suspectée','Autre']).map(x=>`<option>${x}</option>`).join('')}</select></label>${field('Précisions (facultatif)','detail','',{area:1,max:300})}<div class="row gap"><button type="button" class="btn line grow" data-act="sheet-close">Annuler</button><button class="btn pri grow">Envoyer</button></div></form>`)},
 addsvc(){document.getElementById('svcs').insertAdjacentHTML('beforeend',svcRow())},
 delsvc(el){el.closest('.svc').remove()},
 async delphoto(el){const p=myPro(),i=+el.dataset.i,url=p.photos[i],id=p.photoIds[i];
  const r=await sb.from('portfolio_photos').delete().eq('id',id);if(r.error)throw r.error;
  const path=String(url).split('/portfolio/')[1];if(path)sb.storage.from('portfolio').remove([decodeURIComponent(path)]).then(()=>{});
  await loadPublic();render(true)},
 async toggleavail(){const p=myPro();await pupd(p.id,{available:!p.available})},
 async interest(el){const p=myPro(),plan={premium:'PREMIUM',featured:'FEATURED',ads:'LOCAL_AD'}[el.dataset.k];const r=await sb.from('subscriptions').insert({professional_id:p.id,plan,status:'INTEREST'});if(r.error)throw r.error;toast('Merci ! Nous vous préviendrons.')},
 admintab(el){S.adminTab=el.dataset.t;render()},
 async approve(el){await pupd(el.dataset.id,{status:'VERIFIED'});toast('Profil validé.')},
 async reject(el){await pupd(el.dataset.id,{status:'REJECTED'})},
 suspend(el){const p=proById(el.dataset.id);ask(`Suspendre ${p.name} ?`,guard(()=>pupd(p.id,{suspended:true})),'Suspendre')},
 async unsuspend(el){await pupd(el.dataset.id,{suspended:false})},
 delpro(el){const p=proById(el.dataset.id);ask(`Supprimer définitivement le profil de ${p.name} ?`,guard(async()=>{const r=await sb.from('professionals').delete().eq('id',p.id);if(r.error)throw r.error;await loadPublic();await loadMine();render(true)}),'Supprimer')},
 async togglecat(el){const c=catById(el.dataset.id),r=await sb.from('categories').update({active:!c.active}).eq('id',c.id);if(r.error)throw r.error;await loadPublic();render(true)},
 async hidereview(el){const rv=DB.reviews.find(x=>x.id===el.dataset.id);if(!rv)return;const r=await sb.from('reviews').update({hidden:!rv.hidden}).eq('id',rv.id);if(r.error)throw r.error;await loadPublic();render(true)},
 delreview(el){ask('Supprimer cet avis ?',guard(async()=>{const r=await sb.from('reviews').delete().eq('id',el.dataset.id);if(r.error)throw r.error;await loadPublic();render(true)}),'Supprimer')},
 async closereport(el){const r=await sb.from('reports').update({status:'CLOSED'}).eq('id',el.dataset.id);if(r.error)throw r.error;await loadMine();render(true)}
};
document.addEventListener('click',e=>{
 if(e.target.id==='sheet'){closeSheet();return}
 const el=e.target.closest('[data-act]');if(!el)return;
 const fn=ACT[el.dataset.act];if(fn)Promise.resolve(fn(el,e)).catch(er=>toast(errMsg(er)))});

/* ---------- Formulaires ---------- */
const val=(f,n)=>f.elements[n]?String(f.elements[n].value||'').trim():'';
const CONFIRM_MSG=email=>sheet(`<h3>Vérifiez votre e-mail</h3><p>Nous avons envoyé un lien de confirmation à <b>${esc(email)}</b>. Ouvrez-le (regardez aussi les courriers indésirables), puis connectez-vous ici.</p><button class="btn pri block" data-act="sheet-close">D’accord</button>`);
const FORM={
 homesearch(f){S.search=freshSearch();S.search.q=val(f,'q');go('#/search')},
 dosearch(){},
 async login(f){
  await signIn(val(f,'idf'),f.elements.password.value);
  await loadAll();await mergeGuestFavs();await loadMine();
  const u=me();if(!u)throw new Error('Ce compte est suspendu. Contactez l’administration.');
  toast('Bienvenue '+u.name.split(' ')[0]+' !');const r=S.ret;S.ret=null;go(r&&r!=='#/auth'?r:roleHome(u))},
 async regclient(f){
  const email=val(f,'email'),file=f.elements.photo.files[0];
  const res=await signUp('CLIENT',{name:val(f,'name'),phone:val(f,'phone'),email,password:f.elements.password.value});
  if(!res.session){S.authMode='login';render();return CONFIRM_MSG(email)}
  await loadAll();
  if(file&&me()){const url=await uploadImg('avatars',me().id,await readImg(file,256));await sb.from('users').update({avatar_url:url}).eq('id',me().id);await loadUser()}
  await mergeGuestFavs();await loadMine();toast('Compte créé. Bienvenue !');const r=S.ret;S.ret=null;go(r&&r!=='#/auth'?r:'#/home')},
 async regpro(f){
  const email=val(f,'email'),city=val(f,'city'),loc=findLoc(city,val(f,'quartier')),ph=normPhone(val(f,'phone')),wa=val(f,'whatsapp')?normPhone(val(f,'whatsapp')):ph;
  if(!loc)throw new Error('Choisissez votre ville et votre quartier.');
  if(!val(f,'catId'))throw new Error('Choisissez une catégorie.');
  if(!wa)throw new Error('Numéro WhatsApp invalide.');
  const price=Math.max(0,parseInt(val(f,'price'),10)||0),file=f.elements.photo.files[0];
  const draft={business:val(f,'business'),trade:val(f,'trade'),catId:val(f,'catId'),locId:loc.id,whatsapp:wa,zone:val(f,'zone'),desc:val(f,'desc'),svc:val(f,'svc'),price,hours:val(f,'hours'),available:f.elements.available.checked};
  const res=await signUp('PROFESSIONAL',{name:val(f,'name'),phone:val(f,'phone'),email,password:f.elements.password.value,draft});
  if(!res.session){S.authMode='login';render();return CONFIRM_MSG(email)}
  await loadAll();
  const mp=myPro();if(file&&mp){const url=await uploadImg('avatars',me().id,await readImg(file,256));await sb.from('professionals').update({avatar_url:url}).eq('id',mp.id);await loadPublic()}
  toast('Profil créé. Il sera visible après validation.');go('#/dash')},
 async editpro(f){await saveProfile(f);toast('Profil enregistré.');go('#/dash')},
 async review(f){await addReview(f.dataset.id,+(f.querySelector('[name=rating]:checked')||{}).value,val(f,'text'));toast('Merci pour votre avis !');render(true)},
 async send(f){const tx=val(f,'text');if(!tx)return;await sendMessage(f.dataset.id,tx);render()},
 async report(f){await addReport(f.dataset.type,f.dataset.id,val(f,'reason'),val(f,'detail'));closeSheet();toast('Signalement envoyé. Merci.')},
 async addcat(f){const n=val(f,'name');if(!n)return;const slug=norm(n).replace(/\s+/g,'-')+'-'+Math.random().toString(36).slice(2,6);const r=await sb.from('categories').insert({slug,name:n,icon:'tool'});if(r.error)throw r.error;await loadPublic();render(true)}
};
document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 const fn=FORM[f.dataset.form];if(!fn)return;
 const btn=f.querySelector('button:not([type=button])');if(btn)btn.disabled=true;
 Promise.resolve(fn(f)).catch(er=>toast(errMsg(er))).finally(()=>{if(btn)btn.disabled=false})});

/* ---------- Saisie et sélecteurs ---------- */
let qTimer;
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.input==='q'){S.search.q=t.value;S.search.page=1;clearTimeout(qTimer);qTimer=setTimeout(()=>{const r=document.getElementById('results');if(r)r.innerHTML=resultsHtml()},180)}
 if(t.dataset.input==='fdist'){document.getElementById('fdv').textContent=+t.value?t.value+' km':'illimitée'}});
const qOpts=city=>`<option value="">${city?'Choisir':'Choisir la ville'}</option>`+(city&&CITIES[city]?Object.keys(CITIES[city].q).map(x=>`<option>${esc(x)}</option>`).join(''):'');
const CHG={
 scity(t){S.search.city=t.value;S.search.quartier='';S.search.page=1;render(true)},
 squartier(t){S.search.quartier=t.value;S.search.page=1;const r=document.getElementById('results');if(r)r.innerHTML=resultsHtml()},
 lcity(t){document.getElementById('lq').innerHTML=qOpts(t.value)},
 fcity(t){const q=document.getElementById('fq');q.disabled=!t.value;q.innerHTML=qOpts(t.value)},
 async addphotos(t){const p=myPro(),u=me();let n=0;toast('Envoi des photos…');
  for(const file of t.files){if(p.photos.length+n>=8){toast('8 photos maximum.');break}
   const url=await uploadImg('portfolio',u.id,await readImg(file,800));
   const r=await sb.from('portfolio_photos').insert({professional_id:p.id,url});if(r.error)throw r.error;n++}
  await loadPublic();render(true);if(n)toast(n+' photo'+(n>1?'s':'')+' ajoutée'+(n>1?'s':'')+'.')}
};
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.change;if(!k||!CHG[k])return;Promise.resolve(CHG[k](t)).catch(er=>toast(errMsg(er)))});

/* ---------- Rafraîchissement ---------- */
const sig=()=>DB.threads.reduce((a,t)=>a+t.msgs.length,0)+':'+unreadN();
const typing=()=>{const a=document.activeElement;return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))};
async function poll(){if(!me()||document.hidden)return;try{const s0=sig();await loadMine();if(sig()!==s0&&!typing())render(true)}catch(e){}}
let lastRefresh=0;
async function refresh(){if(now()-lastRefresh<60000)return;lastRefresh=now();try{await loadPublic();await loadMine();if(!typing())render(true)}catch(e){}}

/* ---------- Démarrage ---------- */
async function init(){
 const m=document.getElementById('main');
 m.innerHTML=`<div class="empty" style="padding-top:28vh"><div style="display:inline-block">${logo()}</div><p style="margin-top:14px">Chargement…</p></div>`;
 if(!sb){m.innerHTML='<div class="empty" style="padding-top:24vh"><h3>Service indisponible</h3><p>Impossible de charger la connexion sécurisée. Vérifiez votre internet puis réessayez.</p><button class="btn pri" data-act="retry">Réessayer</button></div>';return}
 try{await loadAll()}catch(e){console.error(e);m.innerHTML='<div class="empty" style="padding-top:24vh"><h3>Connexion impossible</h3><p>Vérifiez votre internet puis réessayez.</p><button class="btn pri" data-act="retry">Réessayer</button></div>';return}
 try{if(!location.hash)history.replaceState(null,'','#/home')}catch(e){}
 render();
 if(!init.bound){init.bound=true;
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.user){S.user=null;setTimeout(async()=>{try{await loadPublic();await loadMine();render()}catch(e){}},0)}});
  setInterval(poll,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()})}}
init();
</script>
</body>
</html>
